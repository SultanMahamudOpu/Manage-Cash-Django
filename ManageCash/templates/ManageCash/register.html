
{% extends 'ManageCash/base.html' %}

{% block content %}

<div class="min-h-[70vh] flex items-center justify-center py-10">

    <div class="w-full max-w-lg">

        <!-- Register Card -->
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">

            <!-- Card Header -->
            <div class="bg-gradient-to-r from-emerald-600 to-green-500 px-8 py-8 text-center">

                <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="w-9 h-9 text-white"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M18 9v6m3-3h-6m-2 9H5a2 2 0 01-2-2v-1a7 7 0 0114 0v1a2 2 0 01-2 2zM12 7a4 4 0 11-8 0 4 4 0 018 0z"/>

                    </svg>

                </div>

                <h2 class="text-2xl font-bold text-white">
                    Create Your Account
                </h2>

                <p class="text-green-50 text-sm mt-2">
                    Join ManageCash and take control of your finances
                </p>

            </div>


            <!-- Form Body -->
            <form method="post" class="p-8 space-y-5">

                {% csrf_token %}

                <!-- Username -->
                <div>

                    <label for="username"
                           class="block text-sm font-semibold text-gray-700 mb-2">

                        Username
                        <span class="text-red-500">*</span>

                    </label>

                    <div class="relative">

                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">

                            <svg class="w-5 h-5 text-gray-400"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke="currentColor"
                                 stroke-width="2">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>

                            </svg>

                        </div>

                        <input
                            type="text"
                            name="username"
                            id="username"
                            placeholder="Choose a username"
                            autocomplete="username"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 outline-none transition duration-200"
                            required
                        >

                    </div>

                </div>


                <!-- Email -->
                <div>

                    <label for="email"
                           class="block text-sm font-semibold text-gray-700 mb-2">

                        Email Address

                    </label>

                    <div class="relative">

                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">

                            <svg class="w-5 h-5 text-gray-400"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke="currentColor"
                                 stroke-width="2">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>

                            </svg>

                        </div>

                        <input
                            type="email"
                            name="email"
                            id="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 outline-none transition duration-200"
                        >

                    </div>

                </div>


                <!-- Password -->
                <div>

                    <label for="password"
                           class="block text-sm font-semibold text-gray-700 mb-2">

                        Password
                        <span class="text-red-500">*</span>

                    </label>

                    <div class="relative">

                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">

                            <svg class="w-5 h-5 text-gray-400"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke="currentColor"
                                 stroke-width="2">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>

                            </svg>

                        </div>

                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="Create a strong password"
                            autocomplete="new-password"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 outline-none transition duration-200"
                            required
                        >

                    </div>

                </div>


                <!-- Confirm Password -->
                <div>

                    <label for="confirm_password"
                           class="block text-sm font-semibold text-gray-700 mb-2">

                        Confirm Password
                        <span class="text-red-500">*</span>

                    </label>

                    <div class="relative">

                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">

                            <svg class="w-5 h-5 text-gray-400"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke="currentColor"
                                 stroke-width="2">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 3c-2.755 0-5.293.93-7.318 2.49a11.956 11.956 0 00-1.684 4.274c.138 4.558 2.978 8.467 7.002 10.236a11.94 11.94 0 003.996-2.09c2.337-1.85 3.878-4.67 4.15-7.84z"/>

                            </svg>

                        </div>

                        <input
                            type="password"
                            name="confirm_password"
                            id="confirm_password"
                            placeholder="Enter your password again"
                            autocomplete="new-password"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 outline-none transition duration-200"
                            required
                        >

                    </div>

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="w-full flex items-center justify-center gap-2 px-6 py-3.5 bg-gradient-to-r from-emerald-600 to-green-500 hover:from-emerald-700 hover:to-green-600 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition duration-200 transform hover:-translate-y-0.5">

                    Create Account

                    <svg class="w-5 h-5"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M13 7l5 5m0 0l-5 5m5-5H6"/>

                    </svg>

                </button>

            </form>

        </div>


        <!-- Bottom Note -->
        <div class="text-center mt-6">

            <p class="text-sm text-gray-500">
                Start managing your money smarter with
                <span class="font-semibold text-emerald-600">ManageCash</span>.
            </p>

        </div>

    </div>

</div>

{% endblock %}
