
{% extends 'ManageCash/base.html' %}

{% block content %}

<div class="max-w-3xl mx-auto">

    <!-- Page Header -->
    <div class="mb-8">
        <h2 class="text-3xl font-bold text-gray-800">
            Add Expense
        </h2>
        <p class="text-gray-500 mt-2">
            Record your expenses and manage your spending efficiently.
        </p>
    </div>

    <!-- Form Card -->
    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden">

        <!-- Card Header -->
        <div class="bg-gradient-to-r from-red-600 to-rose-500 px-6 py-5">
            <div class="flex items-center gap-3">

                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="w-7 h-7 text-white"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M12 8c-2.21 0-4 1.12-4 2.5s1.79 2.5 4 2.5 4 1.12 4 2.5S14.21 18 12 18m0-10V6m0 2v10m0 0v2m0-2c-2.21 0-4-1.12-4-2.5"/>
                        <circle cx="12" cy="12" r="9"/>
                    </svg>
                </div>

                <div>
                    <h3 class="text-xl font-semibold text-white">
                        Expense Information
                    </h3>
                    <p class="text-red-50 text-sm">
                        Enter your expense details below
                    </p>
                </div>

            </div>
        </div>

        <!-- Form Body -->
        <form method="post" class="p-6 md:p-8 space-y-6">
            {% csrf_token %}

            <!-- Description -->
            <div>
                <label for="description"
                       class="block text-sm font-semibold text-gray-700 mb-2">
                    Expense Description
                    <span class="text-red-500">*</span>
                </label>

                <input
                    type="text"
                    name="description"
                    id="description"
                    placeholder="e.g. Food, Shopping, Transport, Bills"
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-red-500 focus:ring-4 focus:ring-red-100 outline-none transition duration-200"
                    required
                >
            </div>

            <!-- Amount -->
            <div>
                <label for="amount"
                       class="block text-sm font-semibold text-gray-700 mb-2">
                    Expense Amount
                    <span class="text-red-500">*</span>
                </label>

                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 font-semibold">
                        ৳
                    </span>

                    <input
                        type="number"
                        name="amount"
                        id="amount"
                        placeholder="Enter expense amount"
                        min="0"
                        step="0.01"
                        class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-red-500 focus:ring-4 focus:ring-red-100 outline-none transition duration-200"
                        required
                    >
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t border-gray-100">

                <button
                    type="submit"
                    class="flex-1 inline-flex items-center justify-center gap-2 px-6 py-3 bg-gradient-to-r from-red-600 to-rose-500 hover:from-red-700 hover:to-rose-600 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition duration-200 transform hover:-translate-y-0.5">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="w-5 h-5"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M12 5v14m-7-7h14"/>
                    </svg>

                    Add Expense
                </button>

                <a href="{% url 'dashboard' %}"
                   class="px-6 py-3 text-center bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-xl transition duration-200">
                    Cancel
                </a>

            </div>

        </form>
    </div>

    <!-- Bottom Note -->
    <p class="text-center text-sm text-gray-400 mt-6">
        <span class="text-red-500">●</span>
        Track your expenses to maintain better financial control.
    </p>

</div>

{% endblock %}
