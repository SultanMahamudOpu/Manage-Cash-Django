
{% extends 'ManageCash/base.html' %}

{% block content %}

<div class="min-h-[70vh] flex items-center justify-center py-10">

    <div class="w-full max-w-md">

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">

            <!-- Card Header -->
            <div class="bg-gradient-to-r from-emerald-600 to-green-500 px-8 py-8 text-center">

                <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="w-9 h-9 text-white"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4m-5-4l5-5m0 0l-5-5m5 5H3"/>

                    </svg>

                </div>

                <h2 class="text-2xl font-bold text-white">
                    Welcome Back!
                </h2>

                <p class="text-green-50 text-sm mt-2">
                    Login to manage your personal finances
                </p>

            </div>


            <!-- Form Body -->
            <form method="post" class="p-8 space-y-6">

                {% csrf_token %}

                <!-- Username or Email -->
                <div>

                    <label for="username"
                           class="block text-sm font-semibold text-gray-700 mb-2">

                        Username or Email

                    </label>

                    <div class="relative">

                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">

                            <svg class="w-5 h-5 text-gray-400"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke="currentColor"
                                 stroke-width="2">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>

                            </svg>

                        </div>

                        <input
                            type="text"
                            name="username"
                            id="username"
                            placeholder="Enter your username or email"
                            autocomplete="username"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 outline-none transition duration-200"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div>

                    <label for="password"
                           class="block text-sm font-semibold text-gray-700 mb-2">

                        Password

                    </label>

                    <div class="relative">

                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">

                            <svg class="w-5 h-5 text-gray-400"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke="currentColor"
                                 stroke-width="2">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>

                            </svg>

                        </div>

                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100 outline-none transition duration-200"
                            required
                        >

                    </div>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full flex items-center justify-center gap-2 px-6 py-3.5 bg-gradient-to-r from-emerald-600 to-green-500 hover:from-emerald-700 hover:to-green-600 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition duration-200 transform hover:-translate-y-0.5">

                    Login to Account

                    <svg class="w-5 h-5"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M13 7l5 5m0 0l-5 5m5-5H6"/>

                    </svg>

                </button>

            </form>

        </div>


        <!-- Bottom Note -->
        <div class="text-center mt-6">

            <p class="text-sm text-gray-500">
                Securely manage your income and expenses with
                <span class="font-semibold text-emerald-600">ManageCash</span>.
            </p>

        </div>

    </div>

</div>

{% endblock %}
